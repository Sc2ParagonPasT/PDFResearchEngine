name: Build PDF Research Engine v0.4 (gated)
on:
  workflow_run:
    workflows: ["v0.4 development validation"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: pdfresearch-v04-build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check exact validated commit and original retrieval baseline
        shell: pwsh
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:VALIDATED_SHA) { throw 'Checkout does not match validated source' }
          if ((git rev-parse HEAD:v03).Trim() -ne 'f7d0376ef421050ed1c494495b04e081cac417c7') { throw 'Known-good v0.3 retrieval tree changed' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:VALIDATION_RUN"
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne $env:VALIDATED_SHA -or $run.name -ne 'v0.4 development validation') { throw 'Validation gate did not pass' }
      - name: Verify and extract source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'PDF_Research_Engine_v0.2_source (1).zip'
          if (Test-Path -LiteralPath 'PDF_Research_Engine_v0.2_source.zip') { $zip = 'PDF_Research_Engine_v0.2_source.zip' }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4925353d359a74679a838ef57e9f0d249b16a42f0431013ef1b387a4fa39b0a9') { throw 'Source archive hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath source
          python v04/prepare.py 'source/PDF_Research_Engine_v0.2'
          if ($LASTEXITCODE -ne 0) { throw 'v0.4 overlay failed' }
          python -m compileall -q 'source/PDF_Research_Engine_v0.2'
          if ($LASTEXITCODE -ne 0) { throw 'Source compilation failed' }
          # PyInstaller resolves data paths relative to the generated spec, not the stage.
          $script = 'source/PDF_Research_Engine_v0.2/Build_Windows.ps1'
          $build = Get-Content -Raw -LiteralPath $script
          $stageOld = "'app.py','engine.py','security.py','diagnostics.py','test_engine.py','test_security.py','pdf_rules.yar'"
          $stageNew = "'app.py','engine.py','security.py','diagnostics.py','test_engine.py','test_security.py','pdf_rules.yar','discovery_v03.py','test_discovery_v03.py','desktop_helpers.py','desktop_v04.py','catalog_v04.py','reader_v04.py','test_desktop_v04.py','test_catalog_v04.py','test_reader_v04.py','THIRD_PARTY_NOTICES.md'"
          if (-not $build.Contains($stageOld)) { throw 'Expected staging file list missing' }
          $build = $build.Replace($stageOld,$stageNew)
          if (-not $build.Contains('unittest -v test_engine.py test_security.py')) { throw 'Expected regression command missing' }
          $build = $build.Replace('unittest -v test_engine.py test_security.py','unittest -v test_engine.py test_security.py test_discovery_v03.py test_desktop_v04.py test_catalog_v04.py test_reader_v04.py')
          $old = "--add-data 'pdf_rules.yar;.' --add-data 'vendor/clamav;vendor/clamav' --add-data 'vendor/tessdata;vendor/tessdata'"
          $new = '--add-data ((Join-Path $stage "pdf_rules.yar") + ";.") --add-data ($clamDir + ";vendor/clamav") --add-data ($tessDir + ";vendor/tessdata") --add-data ((Join-Path $stage "THIRD_PARTY_NOTICES.md") + ";.")'
          if (-not $build.Contains($old)) { throw 'Expected PyInstaller data arguments not found' }
          $build = $build.Replace($old,$new)
          $diagnosticOld = @('    $proc = Start-Process -FilePath $candidate -ArgumentList @($mode, (''"'' + $packagedReport + ''"'')) -PassThru -Wait', '    if ($proc.ExitCode -ne 0 -or -not (Test-Path $packagedReport)) { throw ''Packaged diagnostic failed. Inspect the temporary build folder.'' }') -join "`n"
          $diagnosticNew = @('    & (Join-Path $env:GITHUB_WORKSPACE ''ci/Run-StandardUserDiagnostic.ps1'') -Candidate $candidate -Mode $mode -Report $packagedReport', '    if (-not (Test-Path -LiteralPath $packagedReport)) { throw ''Packaged diagnostic report missing.'' }') -join "`n"
          $build = $build.Replace("`r`n","`n")
          if (-not $build.Contains($diagnosticOld)) { throw 'Expected packaged diagnostic invocation not found' }
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $script).Path, $build.Replace($diagnosticOld,$diagnosticNew))
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          python -m py_compile 'source/PDF_Research_Engine_v0.2/diagnostics.py'
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic patch did not compile' }
      - name: Windows live default-source and independent-source retrieval preflight
        working-directory: source/PDF_Research_Engine_v0.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v test_engine test_discovery_v03 test_catalog_v04
          if ($LASTEXITCODE -ne 0) { throw 'Windows retrieval regression tests failed' }
          python -u live_retrieval.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows default repository retrieval gate failed' }
          python -u live_catalog.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows independent collection retrieval gate failed' }
      - name: Preserve Windows preflight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-windows-retrieval-reports
          path: |
            source/PDF_Research_Engine_v0.2/live-retrieval-results.json
            source/PDF_Research_Engine_v0.2/live-catalog-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Extend live packaged diagnostic to reader and real retrieved PDF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          p=Path('source/PDF_Research_Engine_v0.2/diagnostics.py')
          s=p.read_text(encoding='utf-8')
          anchor="                checks['live']='FreshClam update, actual dual-engine scans, OCR and export succeeded on benign local fixture'"
          extra="""
                          from security import ScreenedLibrary
                          from reader_v04 import read_page
                          lib=ScreenedLibrary(pipe.root)
                          lib.save(Result('Diagnostic','https://www.cia.gov/diagnostic.pdf','local fixture'),r)
                          named=pipe.export(r['output_sha256'],destination,title='Diagnostic publication')
                          if named.name!='Diagnostic publication.pdf' or sha256(named)!=r['output_sha256']:raise RuntimeError('Named export diagnostic failed')
                          info,image=read_page(pipe,lib,r['output_sha256'],1,1.0)
                          if info['pages']!=1 or not image:raise RuntimeError('Screened reader diagnostic failed')
                          checks['reader']='Fresh rescans and separate screened-page render passed'
                          from discovery_v03 import Network,run_search
                          from engine import DEFAULT_HOSTS
                          import threading
                          net=Network(DEFAULT_HOSTS);found=[]
                          run_search(net,['arXiv'],['information theory'],[],threading.Event(),lambda k,v:found.append(v) if k=='result' else None)
                          errors=[]
                          for item in found[:3]:
                              evidence=pipe.process(net,item)
                              if evidence['verdict']!='passed':
                                  errors.append(str(evidence.get('reason','denied'))[:200]);continue
                              lib.save(item,evidence)
                              exported=pipe.export(evidence['output_sha256'],destination,title=item.title)
                              if sha256(exported)!=evidence['output_sha256']:raise RuntimeError('Real PDF export hash mismatch')
                              info,image=read_page(pipe,lib,evidence['output_sha256'],1,1.0)
                              if not image:raise RuntimeError('Real PDF reader render missing')
                              checks['real_pdf']={'title':item.title,'url':item.url,'pages':evidence['pages'],'export_sha256':evidence['output_sha256']}
                              break
                          if 'real_pdf' not in checks:raise RuntimeError('No real retrieved document passed complete screening and reading: '+str(errors))
          """
          import textwrap
          extra=textwrap.indent(textwrap.dedent(extra).strip(), '                ')
          if s.count(anchor)!=1:raise RuntimeError('Expected live diagnostic anchor')
          p.write_text(s.replace(anchor,anchor+'\n'+extra),encoding='utf-8')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Packaged diagnostic extension failed' }
      - name: Retrieve and verify official dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Cisco-Talos/clamav/releases/latest'
          $assets = @($release.assets | Where-Object { $_.name -match '^clamav-.+\.win\.x64\.zip$' })
          if ($assets.Count -ne 1) { throw 'Expected one official ClamAV Windows x64 ZIP' }
          $asset = $assets[0]
          if ($asset.digest -notmatch '^sha256:([a-fA-F0-9]{64})$') { throw 'Official GitHub asset SHA256 is unavailable' }
          $clamHash = $Matches[1]
          if ($asset.browser_download_url -notmatch '^https://github\.com/Cisco-Talos/clamav/releases/download/[^?#]+\.zip$') { throw 'Unexpected ClamAV asset origin' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile clamav.zip
          if ((Get-FileHash -LiteralPath clamav.zip -Algorithm SHA256).Hash -ne $clamHash) { throw 'ClamAV digest mismatch' }
          $repo = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/tesseract-ocr/tessdata_fast'
          $commit = Invoke-RestMethod -Headers $headers -Uri ("https://api.github.com/repos/tesseract-ocr/tessdata_fast/commits/" + $repo.default_branch)
          $revision = $commit.sha
          if ($revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid upstream commit SHA' }
          $meta = Invoke-RestMethod -Headers $headers -Uri ("https://api.github.com/repos/tesseract-ocr/tessdata_fast/contents/eng.traineddata?ref=" + $revision)
          $tessUrl = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$revision/eng.traineddata"
          Invoke-WebRequest -Uri $tessUrl -OutFile eng.traineddata
          $blob = (git hash-object --no-filters eng.traineddata).Trim()
          if ($LASTEXITCODE -ne 0 -or $blob -ne $meta.sha) { throw 'English OCR data Git blob hash mismatch' }
          $tessHash = (Get-FileHash -LiteralPath eng.traineddata -Algorithm SHA256).Hash
          @{ clamav_release = $release.tag_name; clamav_url = $asset.browser_download_url; clamav_sha256 = $clamHash; tessdata_revision = $revision; tessdata_url = $tessUrl; tessdata_sha256 = $tessHash } | ConvertTo-Json | Set-Content -Encoding utf8 BUILD_INPUTS.json
          "CLAM_HASH=$clamHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TESS_HASH=$tessHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile and run actual scanner diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $src = Join-Path $root 'source/PDF_Research_Engine_v0.2'
          try {
            & (Join-Path $src 'Build_Windows.ps1') -ClamAVZip (Join-Path $root 'clamav.zip') -ClamAVSHA256 $env:CLAM_HASH -EnglishTessdata (Join-Path $root 'eng.traineddata') -TessdataSHA256 $env:TESS_HASH -LiveTest
          } finally {
            Get-ChildItem -LiteralPath $src -Directory -Filter '.build-win-*' | ForEach-Object {
              foreach ($name in @('source-diagnostics.json','packaged-diagnostics.json')) {
                $report = Join-Path $_.FullName $name
                if (Test-Path -LiteralPath $report) { Write-Host "Diagnostic report: $name"; Get-Content -Raw -LiteralPath $report | Write-Host }
              }
            }
          }
          Copy-Item BUILD_INPUTS.json (Join-Path $src 'dist/BUILD_INPUTS.json')
          @{ version = '0.4'; validation_run = "${{ github.event.workflow_run.id }}"; build_commit = "${{ github.event.workflow_run.head_sha }}"; live_validated_defaults = @('ERIC','NASA NTRS','arXiv'); independent_sources_report = 'v04-windows-retrieval-reports'; distribution = 'experimental unsigned development build' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $src 'dist/RETRIEVAL_VALIDATION.json')
      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: PDFResearchEngine-v0.4-Windows-x64-experimental
          path: source/PDF_Research_Engine_v0.2/dist/
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDFResearchEngine-v0.4-Windows-x64-experimental
          path: dist
      - name: Attach standalone executable to private-to-maintainers draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s dist/PDFResearchEngine.exe
          test -s dist/SHA256.txt
          gh release create "v0.4-experimental-${RUN_ID}" --draft --target "$VALIDATED_SHA" --title "PDF Research Engine v0.4 experimental development build" --notes "Unsigned experimental build for repository-maintainer testing only. Public redistribution requires licensing and clean Windows desktop review. The standalone executable contains runtime dependencies. Build reports and corresponding source are retained separately." dist/PDFResearchEngine.exe dist/SHA256.txt
